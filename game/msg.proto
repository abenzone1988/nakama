syntax = "proto3";

package game;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/heroiclabs/nakama/v3/game";

option java_multiple_files = true;
option java_outer_classname = "GameMsg";
option java_package = "com.huohuaji.star";

option csharp_namespace = "Game.Protobuf";

message RedeemGiftRequest{
  string gift_code = 1;
}


message RedeemGiftResponse{
  int32 code = 1;
  string msg = 2;
}

message FeedbackRequest {
  int32 issues = 1;
  string description = 2;
}

message AuthenticateWechatRequest{
  string code = 1;
}

message AuthenticateTiktokRequest{
  string code = 1;
  string anonymous_code = 2;
}

message SubmitBeInvitedRequest {
  string inviter_id = 1;
}

message ListInviteeResponse{
  repeated string invitee_ids = 1;
}

message ClaimInviteRewardRequest{
  repeated string invitee_ids = 1;
}

message GetGameTimeResponse{
  google.protobuf.Timestamp game_time = 1;
}

// 获取已发布公告请求
message ListPublishedAnnouncementsRequest {
  int32 limit = 1;  // 每页数量
  string cursor = 2;  // 分页游标
}

// 公告信息
message AnnouncementInfo {
  string id = 1;  // 公告ID
  string title = 2;  // 标题
  string content = 3;  // 内容
  string img = 4;  // 图片URL
  google.protobuf.Timestamp create_time = 5;  // 创建时间
  google.protobuf.Timestamp update_time = 6;  // 更新时间
}

// 获取已发布公告响应
message ListPublishedAnnouncementsResponse {
  repeated AnnouncementInfo announcements = 1;  // 公告列表
  int32 total_count = 2;  // 总数
  string next_cursor = 3;  // 下一页游标
}

// 体力数据
message StaminaData{
  int32 stamina = 1;
  string last_refresh_time = 2; // ISO 8601 格式，例如 "2024-05-18T12:34:56Z"
}

message EquipData{
  repeated string battle_equips = 1;
  map<string, int32> unlock_equips = 2;
  int32 crystal_tech_tree_index = 3;
}

// 玩家元数据
message UserMeta{
  int64 last_sync_notice = 1;//秒级时间戳（unix seconds）
  StaminaData stamina = 2;
  EquipData equip = 3;
}

// 钱包结构
message Wallet{
  int32 coin = 1;
  int32 gem = 2;
  int32 ad = 3;
}

// 道具
message Item {
  string id = 1;
  int32 num = 2;
}

// 奖励数据
message Reward{
  Wallet wallet = 1;
  repeated Item items = 2;
}

// 钱包更新结果
message WalletUpdateResult {
  Wallet previous = 1; // 更新前的钱包状态
  Wallet updated = 2;   // 更新后的钱包状态
}

// 背包更新结果
message InventoryUpdateResult {
 repeated Item previous = 1; // 更新前的背包状态
 repeated Item updated = 2;   // 更新后的背包状态
}

// VIP状态
message CheckVipStatusResponse {
  // Expire time in seconds (int64 to avoid 2038 problem)
  int64 expire_time = 1;
  // Signature
  string signature = 2;
}

enum BattleType{
  BATTLE_TYPE_NORMAL = 0;
  BATTLE_TYPE_GOLDEN = 1;
}

//结束战斗
message EndBattleRequest{
  BattleType type = 1;
  string level_id = 2;
  int32 progress = 3;
}

message EndBattleResponse{
  int32 code = 1;
  string msg = 2;
  Reward reward = 3; // 奖励数据
  Wallet wallet_updated = 4; // 钱包更新结果
  repeated Item inventory_updated = 5; // 背包更新结果
}

message OperateWalletRequest{
  enum Option {
    GAIN = 0;
    CONSUME = 1;
  }
  Option option = 1; // 操作类型
  int32 coin = 2;
  int32 gem = 3;
  int32 ad = 4;
  string reason = 5;
  string signature = 6;
  string id = 7;
}

message OperateWalletResponse{
  int32 code = 1;
  string msg = 2;
  Wallet wallet_updated = 3; // 钱包更新结果
}


message OperateInventoryRequest{
  enum Option {
    ADD = 0;
    SUBTRACT = 1;
  }
  Option option = 1; // 操作类型
  repeated Item items = 2;
  string reason = 3;
  string signature = 4;
  string id = 5;
}

message OperateInventoryResponse{
  int32 code = 1;
  string msg = 2;
  repeated Item inventory_updated = 5; // 背包更新结果
}

message UpdateEquipDataRequest{
  string equip_id = 1;
}

message UpdateEquipDataResponse{
  int32 code = 1;
  string msg = 2;
  EquipData equip_data = 3;
  Wallet wallet_updated = 4; // 钱包更新结果
  repeated Item inventory_updated = 5; // 背包更新结果
}

// 商店相关消息定义
enum MoneyType {
  MONEY_TYPE_NULL = 0;    // 免费
  MONEY_TYPE_COIN = 1;    // 金币
  MONEY_TYPE_GEM = 2;     // 钻石
  MONEY_TYPE_AD = 3;      // 广告
  MONEY_TYPE_SILVER_COIN = 4; // 银币
}

// 支付信息
message PayInfo {
  MoneyType pay_type = 1;
  int32 price = 2;
  int32 limit_count = 3;
}

// 每日商店商品
message DailyShopItem {
  int32 index = 1;              // 商品在列表中的索引
  string shop_item_id = 2;      // 配置表ID
  string item_id = 3;           // 物品ID
  MoneyType pay_type = 4;
  int32 price = 5;
  int32 discount = 6;
  int32 count = 7;
  int32 limit_count = 8;
}

// 固定商店商品（不需要索引，直接用shop_item_id定位）
message PermanentShopItem {
  string shop_item_id = 1;      // 配置表ID（唯一标识）
  string item_id = 2;           // 物品ID
  MoneyType pay_type = 3;
  int32 price = 4;
  int32 count = 5;
  int32 limit_count = 6;
  repeated PayInfo pay_infos = 7;
}

// 宝箱商店商品（只有一个宝箱，不需要索引）
message BoxShopItem {
  bool can_see_ad = 1;
  string next_refresh_time = 2;
  string shop_item_id = 3;      // 配置表ID（唯一标识）
  MoneyType pay_type = 4;
  int32 retail_price = 5;
  int32 wholesale_price = 6;
  int32 refresh_time = 7;
}

// 每日商店数据
message DailyShopData {
  int32 auto_refresh_time = 1;
  int32 handle_refresh_times = 2;
  PermanentShopItem permanent_item = 3;
  repeated DailyShopItem daily_items = 4;
}

// 金币袋商店数据
message CoinBagShopData {
  repeated PermanentShopItem permanent_items = 1;
}

// 体力商店数据
message StrengthShopData {
  repeated PermanentShopItem permanent_items = 1;
}

// 宝箱商店数据
message BoxShopData {
  int32 box_shop_level = 1;
  int32 box_shop_exp = 2;
  BoxShopItem box1_item = 3;
}

// 章节商店数据
message ChapterShopData {
  map<string, int32> chapter_data_map = 1;
}

// 钻石商店数据
message GemShopData {
  map<string, int32> gem_data_map = 1;
}

// 完整商店数据
message ShopData {
  string date_time = 1;
  DailyShopData daily_shop = 2;
  CoinBagShopData coin_bag_shop = 3;
  StrengthShopData strength_shop = 4;
  BoxShopData box_shop = 5;
  ChapterShopData chapter_shop = 6;
  GemShopData gem_shop = 7;
}

// 商店类型枚举
enum ShopType {
  SHOP_TYPE_DAILY = 0;           // 每日商店（随机商品）
  SHOP_TYPE_DAILY_PERMANENT = 1; // 每日商店（固定商品）
  SHOP_TYPE_COIN_BAG = 2;        // 金币袋商店
  SHOP_TYPE_STRENGTH = 3;        // 体力商店
  SHOP_TYPE_BOX = 4;             // 宝箱商店
  SHOP_TYPE_CHAPTER = 5;         // 章节商店
  SHOP_TYPE_GEM = 6;             // 钻石商店
}

// 购买商店商品请求
message BuyShopItemRequest {
  ShopType shop_type = 1;     // 商店类型
  string item_id = 2;         // 商品ID（对于每日商店是索引，其他是配置ID）
  int32 count = 3;            // 购买数量（默认1，宝箱可能多个）
  bool use_ad = 4;            // 是否使用广告
  bool ad_watched = 5;        // 客户端是否已看完广告（true=免费，false=扣广告券）
}

// 购买商店商品响应
message BuyShopItemResponse {
  int32 code = 1;
  string msg = 2;
  Reward reward = 3;                    // 获得的奖励
  Wallet wallet_updated = 4;            // 更新后的钱包
  repeated Item inventory_updated = 5;   // 更新后的背包
  ShopData shop_data = 6;               // 更新后的商店数据
  bool box_level_up = 7;                // 宝箱是否升级
}
