syntax = "proto3";

package game;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/heroiclabs/nakama/v3/game";

option java_multiple_files = true;
option java_outer_classname = "GameMsg";
option java_package = "com.huohuaji.star";

option csharp_namespace = "Game.Protobuf";

message RedeemGiftRequest{
  string gift_code = 1;
}


message RedeemGiftResponse{
  int32 code = 1;
  string msg = 2;
}

message FeedbackRequest {
  int32 issues = 1;
  string description = 2;
}

message AuthenticateWechatRequest{
  string code = 1;
}

message AuthenticateTiktokRequest{
  string code = 1;
  string anonymous_code = 2;
}

message SubmitBeInvitedRequest {
  string inviter_id = 1;
}

message ListInviteeResponse{
  repeated string invitee_ids = 1;
}

message ClaimInviteRewardRequest{
  repeated string invitee_ids = 1;
}

message GetGameTimeResponse{
  google.protobuf.Timestamp game_time = 1;
}

// 获取已发布公告请求
message ListPublishedAnnouncementsRequest {
  int32 limit = 1;  // 每页数量
  string cursor = 2;  // 分页游标
}

// 公告信息
message AnnouncementInfo {
  string id = 1;  // 公告ID
  string title = 2;  // 标题
  string content = 3;  // 内容
  string img = 4;  // 图片URL
  google.protobuf.Timestamp create_time = 5;  // 创建时间
  google.protobuf.Timestamp update_time = 6;  // 更新时间
}

// 获取已发布公告响应
message ListPublishedAnnouncementsResponse {
  repeated AnnouncementInfo announcements = 1;  // 公告列表
  int32 total_count = 2;  // 总数
  string next_cursor = 3;  // 下一页游标
}

// 体力数据
message StaminaData{
  int32 stamina = 1;
  string last_refresh_time = 2; // ISO 8601 格式，例如 "2024-05-18T12:34:56Z"
}

message EquipData{
  repeated string battle_equips = 1;
  map<string, int32> unlock_equips = 2;
  int32 crystal_tech_tree_index = 3;
}

// 玩家元数据
message UserMeta{
  int64 last_sync_notice = 1;//秒级时间戳（unix seconds）
  StaminaData stamina = 2;
  EquipData equip = 3;
}

// 钱包结构
message Wallet{
  int32 coin = 1;
  int32 gem = 2;
  int32 ad = 3;
}

// 道具
message Item {
  string id = 1;
  int32 num = 2;
}

// 奖励数据
message Reward{
  Wallet wallet = 1;
  repeated Item items = 2;
}

// 钱包更新结果
message WalletUpdateResult {
  map<string, int32> previous = 1; // 更新前的钱包状态
  map<string, int32> updated = 2;   // 更新后的钱包状态
}

// 背包更新结果
message InventoryUpdateResult {
  map<string, int32> previous = 1; // 更新前的背包状态
  map<string, int32> updated = 2;   // 更新后的背包状态
}

// VIP状态
message CheckVipStatusResponse {
  // Expire time in seconds (int64 to avoid 2038 problem)
  int64 expire_time = 1;
  // Signature
  string signature = 2;
}

enum BattleType{
  BATTLE_TYPE_NORMAL = 0;
  BATTLE_TYPE_GOLDEN = 1;
}

//结束战斗
message EndBattleRequest{
  BattleType type = 1;
  string level_id = 2;
  int32 progress = 3;
}

message EndBattleResponse{
  int32 code = 1;
  string msg = 2;
  Reward reward = 3; // 奖励数据
  WalletUpdateResult wallet_update = 4; // 钱包更新结果
  InventoryUpdateResult inventory_update = 5; // 背包更新结果
}

message OperateWalletRequest{
  enum Option {
    GAIN = 0;
    CONSUME = 1;
  }
  Option option = 1; // 操作类型
  int32 coin = 2;
  int32 gem = 3;
  int32 ad = 4;
  string reason = 5;
  string signature = 6;
  string id = 7;
}

message OperateWalletResponse{
  int32 code = 1;
  string msg = 2;
  WalletUpdateResult wallet_update = 3; // 钱包更新结果
}


message OperateInventoryRequest{
  enum Option {
    ADD = 0;
    SUBTRACT = 1;
  }
  Option option = 1; // 操作类型
  repeated Item items = 2;
  string reason = 3;
  string signature = 4;
  string id = 5;
}

message OperateInventoryResponse{
  int32 code = 1;
  string msg = 2;
  InventoryUpdateResult inventory_update = 5; // 背包更新结果
}

message UpdateEquipDataRequest{
  string equip_id = 1;
}

message UpdateEquipDataResponse{
  int32 code = 1;
  string msg = 2;
  EquipData equip_data = 3;
  WalletUpdateResult wallet_update = 4; // 钱包更新结果
  InventoryUpdateResult inventory_update = 5; // 背包更新结果
}
