syntax = "proto3";

package game;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/heroiclabs/nakama/v3/game";

option java_multiple_files = true;
option java_outer_classname = "GameMsg";
option java_package = "com.huohuaji.star";

option csharp_namespace = "Game.Protobuf";

message RedeemGiftRequest{
  string gift_code = 1;
}


message RedeemGiftResponse{
  int32 code = 1;
  string msg = 2;
}

message FeedbackRequest {
  int32 issues = 1;
  string description = 2;
}

message AuthenticateWechatRequest{
  string code = 1;
}

message AuthenticateTiktokRequest{
  string code = 1;
  string anonymous_code = 2;
}

message SubmitBeInvitedRequest {
  string inviter_id = 1;
}

message ListInviteeResponse{
  repeated string invitee_ids = 1;
}

message ClaimInviteRewardRequest{
  repeated string invitee_ids = 1;
}

message GetGameTimeResponse{
  google.protobuf.Timestamp game_time = 1;
}

// 获取已发布公告请求
message ListPublishedAnnouncementsRequest {
  int32 limit = 1;  // 每页数量
  string cursor = 2;  // 分页游标
}

// 公告信息
message AnnouncementInfo {
  string id = 1;  // 公告ID
  string title = 2;  // 标题
  string content = 3;  // 内容
  string img = 4;  // 图片URL
  google.protobuf.Timestamp create_time = 5;  // 创建时间
  google.protobuf.Timestamp update_time = 6;  // 更新时间
}

// 获取已发布公告响应
message ListPublishedAnnouncementsResponse {
  repeated AnnouncementInfo announcements = 1;  // 公告列表
  int32 total_count = 2;  // 总数
  string next_cursor = 3;  // 下一页游标
}

// 体力数据
message StaminaData{
  int32 stamina = 1;
  string last_refresh_time = 2; // ISO 8601 格式，例如 "2024-05-18T12:34:56Z"
}

message EquipData{
  repeated string battle_equips = 1;
  map<string, int32> unlock_equips = 2;
  int32 crystal_tech_tree_index = 3;
}

message LevelData{
  string cur_level_id = 1;
  int32 best_progress = 2;
  int32 has_mopping_times = 3; // 第一阶段已使用次数（扣体力）
  int32 has_mopping_times_for_adv = 4; // 第二阶段已使用次数（扣体力+广告）
  string last_mopping_timestamp = 5; // 最后一次扫荡时间，用于每日刷新，ISO 8601 格式
  string last_get_on_hook_timestamp = 6; // 最后一次领取挂机奖励时间，ISO 8601 格式
}

// 玩家元数据
message UserMeta{
  int64 last_sync_notice = 1;//秒级时间戳（unix seconds）
  StaminaData stamina = 2;
  EquipData equip = 3;
  LevelData level = 4;
}

// 钱包结构
message Wallet{
  int32 coin = 1;
  int32 gem = 2;
  int32 ad = 3;
}

// 道具
message Item {
  string id = 1;
  int32 num = 2;
}

// 奖励数据
message Reward{
  Wallet wallet = 1;
  repeated Item items = 2;
}

// 钱包更新结果
message WalletUpdateResult {
  Wallet previous = 1; // 更新前的钱包状态
  Wallet updated = 2;   // 更新后的钱包状态
}

// 背包更新结果
message InventoryUpdateResult {
 repeated Item previous = 1; // 更新前的背包状态
 repeated Item updated = 2;   // 更新后的背包状态
}

// VIP状态
message CheckVipStatusResponse {
  // Expire time in seconds (int64 to avoid 2038 problem)
  int64 expire_time = 1;
  // Signature
  string signature = 2;
}

enum BattleType{
  BATTLE_TYPE_NORMAL = 0;
  BATTLE_TYPE_GOLDEN = 1;
}

//结束战斗
message EndBattleRequest{
  BattleType type = 1;
  string level_id = 2;
  int32 progress = 3;
}

message EndBattleResponse{
  int32 code = 1;
  string msg = 2;
  Reward reward = 3; // 奖励数据
  Wallet wallet_updated = 4; // 钱包更新结果
  repeated Item inventory_updated = 5; // 背包更新结果
}

// 扫荡奖励请求
message ClaimMoppingRewardRequest{
  bool watched_ad = 1; // 是否观看了广告（第二阶段使用）
}

// 扫荡奖励响应
message ClaimMoppingRewardResponse{
  int32 code = 1;
  string msg = 2;
  Reward reward = 3; // 奖励数据
  Wallet wallet_updated = 4; // 钱包更新结果
  repeated Item inventory_updated = 5; // 背包更新结果
  int32 has_mopping_times = 6; // 第一阶段已使用次数
  int32 has_mopping_times_for_adv = 7; // 第二阶段已使用次数
}

// 领取挂机奖励请求
message ClaimOnHookRewardRequest{
}

// 领取挂机奖励响应
message ClaimOnHookRewardResponse{
  int32 code = 1;
  string msg = 2;
  int32 hours = 3; // 领取的小时数
  int32 coin = 4; // 金币奖励
  Reward reward = 5; // 其他奖励数据
  Wallet wallet_updated = 6; // 钱包更新结果
  repeated Item inventory_updated = 7; // 背包更新结果
}

message OperateWalletRequest{
  enum Option {
    GAIN = 0;
    CONSUME = 1;
  }
  Option option = 1; // 操作类型
  int32 coin = 2;
  int32 gem = 3;
  int32 ad = 4;
  string reason = 5;
  string signature = 6;
  string id = 7;
}

message OperateWalletResponse{
  int32 code = 1;
  string msg = 2;
  Wallet wallet_updated = 3; // 钱包更新结果
}


message OperateInventoryRequest{
  enum Option {
    ADD = 0;
    SUBTRACT = 1;
  }
  Option option = 1; // 操作类型
  repeated Item items = 2;
  string reason = 3;
  string signature = 4;
  string id = 5;
}

message OperateInventoryResponse{
  int32 code = 1;
  string msg = 2;
  repeated Item inventory_updated = 5; // 背包更新结果
}

message UpdateEquipDataRequest{
  string equip_id = 1;
}

message UpdateEquipDataResponse{
  int32 code = 1;
  string msg = 2;
  EquipData equip_data = 3;
  Wallet wallet_updated = 4; // 钱包更新结果
  repeated Item inventory_updated = 5; // 背包更新结果
}

// 商店相关消息定义
enum PayType {
  FREE = 0;    // 免费
  COIN = 1;    // 金币
  GEM = 2;     // 钻石
  AD = 3;      // 广告
  IAP = 4; // IAP 直购
}

// 商店商品（普通商店）
message ShopItem {
  int32 index = 1;                // 商品在列表中的索引
  string shop_item_id = 2;        // 配置表ID
  string item_id = 3;             // 物品ID
  PayType pay_type = 4;           // 货币类型
  int32 price = 5;                // 当前价格
  int32 discount = 6;             // 折扣（0-10，0表示无折扣）
  int32 item_count = 7;           // 商品数量
  int32 max_buy_count = 8;        // 最大购买次数（0表示无限制）
  int32 bought_count = 9;         // 已购买次数
}

// 单个商店数据（普通商店）
message SingleShopData {
  ShopType shop_type = 1;         // 商店类型
  repeated ShopItem items = 2;    // 商品列表
  bool can_refresh = 3;           // 是否可手动刷新
  int32 refresh_count = 4;        // 已手动刷新次数
  string next_refresh_time = 5;   // 下次自动刷新时间
}

// 完整商店数据
message ShopData {
  string date_time = 1;
  repeated SingleShopData shops = 2;  // 所有商店列表
}

// 商店类型枚举（只包含基于TplShop配置的常规商店）
enum ShopType {
  SHOP_DAILY = 0;      // 每日商店
  SHOP_COIN = 1;       // 金币商店
  SHOP_STRENGTH = 2;   // 体力商店
}

// 购买商店商品请求
message BuyShopItemRequest {
  ShopType shop_type = 1;     // 商店类型
  int32 index = 2;            // 商品索引
  int32 count = 3;            // 购买数量（默认1，宝箱可能多个）
  bool use_ad = 4;            // 是否使用广告券（true=扣广告券，false=已看完广告免费）
}

// 购买商店商品响应
message BuyShopItemResponse {
  int32 code = 1;
  string msg = 2;
  Reward reward = 3;                    // 获得的奖励
  Wallet wallet_updated = 4;            // 更新后的钱包
  repeated Item inventory_updated = 5;   // 更新后的背包
  ShopData shop_data = 6;               // 更新后的商店数据
  bool box_level_up = 7;                // 宝箱是否升级
}

// 手动刷新商店请求
message RefreshShopRequest {
  ShopType shop_type = 1;     // 商店类型
}

// 手动刷新商店响应
message RefreshShopResponse {
  int32 code = 1;
  string msg = 2;
  SingleShopData shop_data = 3;  // 刷新后的商店数据
  Wallet wallet_updated = 4;      // 更新后的钱包（扣除刷新费用）
}

// ==================== 宝箱商店（独立） ====================
// 宝箱商店数据
message BoxShopData {
  string box_item_id = 1;         // 当前宝箱商品ID（对应TplBoxShopItem的ID）
  int32 box_level = 2;            // 宝箱等级
  int32 box_exp = 3;              // 宝箱经验
}

// 购买宝箱请求
message BuyBoxItemRequest {
  int32 count = 1;      // 开启数量（1或10）
  bool use_key = 2;     // 是否使用宝箱钥匙（itemId: 20001）
}

// 购买宝箱响应
message BuyBoxItemResponse {
  int32 code = 1;
  string msg = 2;
  Reward reward = 3;
  Wallet wallet_updated = 4;
  repeated Item inventory_updated = 5;
  BoxShopData box_shop_data = 6;  // 更新后的宝箱商店
  bool box_level_up = 7;          // 是否升级
}

// ==================== 章节商店（独立，IAP） ====================
message ChapterShopData {
  repeated ShopItem items = 1;    // 章节商品列表
}

// 购买章节商品请求
message BuyChapterItemRequest {
  int32 index = 1;      // 商品索引
}

// 购买章节商品响应
message BuyChapterItemResponse {
  int32 code = 1;
  string msg = 2;
  Reward reward = 3;
  repeated Item inventory_updated = 4;
  ChapterShopData chapter_shop_data = 5;  // 更新后的章节商店
}

// ==================== 钻石商店（独立，IAP） ====================
message GemShopData {
  repeated ShopItem items = 1;    // 钻石商品列表
}

// 购买钻石商品请求
message BuyGemItemRequest {
  int32 index = 1;      // 商品索引
}

// 购买钻石商品响应
message BuyGemItemResponse {
  int32 code = 1;
  string msg = 2;
  Reward reward = 3;
  Wallet wallet_updated = 4;
  GemShopData gem_shop_data = 5;  // 更新后的钻石商店
}
