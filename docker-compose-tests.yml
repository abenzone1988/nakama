services:
  db:
    container_name: db
    image: postgres:16.8-alpine
    command: -c 'max_connections=1000'
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      start_period: 10s
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    container_name: redis
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    environment:
      - REDIS_PASSWORD=redis123
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      start_period: 10s
      interval: 10s
      timeout: 10s
      retries: 10

  nakama:
    build:
      context: .
      dockerfile: ./build/Dockerfile
    image: nakama-tests
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@db:5432/nakama &&
        exec /nakama/nakama --config /nakama/config.yml
    restart: always
    links:
      - "db:db"
      - "redis:redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config_docker_test.yml:/nakama/config.yml:ro
      - ./data:/nakama/data:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      timeout: 10s
      retries: 10
      start_period: 5s
      interval: 5s

  test:
      image: "golang:1.23.5"
      command: /bin/sh -c "mkdir -p /nakama/internal/gopher-lua/_lua5.1-tests/libs/P1; go test -v -race ./..."

      working_dir: "/nakama"
      environment:
        - "GODEBUG=netdns=cgo"
        - TEST_DB_URL=postgresql://postgres:localdb@db:5432/nakama?sslmode=disable
        - TEST_REDIS_URL=redis://redis:6379
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - DOCKER_ENV=true
      volumes:
        - "./:/nakama"
        - "lua:/nakama/internal/gopher-lua/_lua5.1-tests/libs"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        nakama:
          condition: service_healthy
      networks:
        - default

volumes:
  lua:
  redis_data:

networks:
  default:
    driver: bridge
