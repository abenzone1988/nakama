# 说明：
# 1) 先运行 migrate 服务执行数据库升级，成功后再启动 nakama。
# 2) nakama 通过 Loki 日志驱动把日志转发到 log-center（需在宿主机安装 loki logging driver）。
# 3) 健康检查使用内置命令 `nakama healthcheck`，失败将标记容器为 unhealthy；结合 restart 策略用于恢复。


services:
  nakama:
    image: docker.sparkinfi.com:8443/game/nakama:latest
    container_name: wx-hjzx
      /nakama/nakama migrate up --database.address "postgres://root:sparkinfi123%21@192.168.0.4:5432/hjzx?sslmode=disable" &&
      exec /nakama/nakama --config /nakama/data/config.yml
    ports:
      - "7349:7349"   # grpc端口
      - "7350:7350"   # http端口
      - "7351:7351"   # 控制台端口
      - "9100:9100"   # Prometheus 端口
    volumes:
      - ./config.yml:/nakama/data/config.yml:ro
      - ./modules:/nakama/data/modules:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    # 将容器 stdout/stderr 日志转发到 Loki（log-center 暴露在宿主 3100 端口）
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:-http://192.168.0.2:3100/loki/api/v1/push}
        loki-retries: "5"
        loki-batch-wait: "1s"
        loki-batch-size: "409600"
        labels: "container_name,compose_service,image"
        loki-external-labels: "job=nakama,project=wx-hjzx"



 