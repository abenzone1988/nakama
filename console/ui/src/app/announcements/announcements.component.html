<h2 class="pb-1">公告管理</h2>
<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">公告列表</h5>
          <div class="d-flex gap-3">
            <select class="form-select" [(ngModel)]="statusFilter" (change)="onStatusFilterChange()">
              <option value="">全部状态</option>
              <option value="0">草稿</option>
              <option value="1">已发布</option>
              <option value="2">已下线</option>
            </select>
            <button class="btn btn-primary" (click)="openModal(announcementModal)">
              新增公告
            </button>
          </div>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>标题</th>
                  <th>内容</th>
                  <th>图片</th>
                  <th>状态</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let announcement of announcements">
                  <td>{{announcement.title}}</td>
                  <td>
                    <div class="text-truncate" style="max-width: 200px;">
                      {{announcement.content}}
                    </div>
                  </td>
                  <td>
                    <img *ngIf="announcement.img" [src]="announcement.img"
                         class="img-thumbnail" style="max-width: 50px;">
                  </td>
                  <td>
                    <span class="badge" [ngClass]="getStatusClass(announcement.status)">
                      {{getStatusText(announcement.status)}}
                    </span>
                  </td>
                  <td>{{announcement.create_time | date:'yyyy-MM-dd HH:mm:ss'}}</td>
                  <td>
                    <div class="btn-group">
                      <button class="btn btn-sm btn-outline-primary"
                              (click)="openModal(announcementModal, announcement)">
                        编辑
                      </button>
                      <button class="btn btn-sm btn-outline-danger"
                              (click)="deleteAnnouncement(announcement)">
                        删除
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <div>
              总计: {{totalCount}} 条记录
            </div>
            <ngb-pagination
              [(page)]="currentPage"
              [collectionSize]="totalCount"
              [pageSize]="pageSize"
              (pageChange)="onPageChange($event)"
            ></ngb-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑公告模态框 -->
<ng-template #announcementModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">{{editingAnnouncement ? '编辑公告' : '新增公告'}}</h4>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">标题</label>
        <input type="text" class="form-control" formControlName="title">
        <div class="invalid-feedback" *ngIf="form.get('title')?.errors?.required">
          请输入标题
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">内容</label>
        <textarea class="form-control" rows="4" formControlName="content"></textarea>
        <div class="invalid-feedback" *ngIf="form.get('content')?.errors?.required">
          请输入内容
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">图片URL</label>
        <input type="text" class="form-control" formControlName="img">
        <small class="form-text text-muted">可选，支持图片URL地址</small>
      </div>

      <div class="mb-3">
        <label class="form-label">状态</label>
        <select class="form-select" formControlName="status">
          <option [value]="0">草稿</option>
          <option [value]="1">已发布</option>
          <option [value]="2">已下线</option>
        </select>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">取消</button>
    <button type="button" class="btn btn-primary" (click)="onSubmit()"
            [disabled]="form.invalid">确定</button>
  </div>
</ng-template>
