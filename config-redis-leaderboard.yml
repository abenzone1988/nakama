# Session管理使用Redis实现分布式会话
session:
  encryption_key: "defaultencryptionkey"
  token_expiry_sec: 86400
  refresh_encryption_key: "defaultrefreshencryptionkey"
  refresh_token_expiry_sec: 186400
  single_socket: true
  single_session: true
  use_redis: true
  redis_address: "192.168.102.223:6379"
