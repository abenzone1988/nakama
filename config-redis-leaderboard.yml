  use_redis: true
  redis_address: "192.168.102.223:6379"
  redis_password: ""
  
  # 排行榜缓存工作线程数
  rank_cache_workers: 4
  
  # 回调队列配置
  callback_queue_size: 65536
  callback_queue_workers: 8
  
  # 黑名单配置（可选）
  # blacklist_rank_cache: ["test_leaderboard"]  # 禁用特定排行榜的缓存
  # blacklist_rank_cache: ["*"]                 # 禁用所有排行榜缓存

