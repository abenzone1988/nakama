# ============================================================================
#  hjzx.sfgames.io —— TLS 终结 + 反向代理到 Nakama 7350
#
#  源文件（本仓库）。部署位置：/etc/nginx/conf.d/hjzx.conf
#  部署方式：build\nginx\deploy-hjzx-nginx.bat
#
#  证书（不在仓库里，走 .nakama-deploy / build\hjzx.sfgames.io_nginx）：
#    /etc/nginx/ssl/hjzx.sfgames.io/fullchain.pem   （leaf + intermediate）
#    /etc/nginx/ssl/hjzx.sfgames.io/privkey.pem     （600 root）
#
#  ⚠️ 证书 2027-04-12 到期，没有任何自动续期，到期不换 443 直接挂。
#     续期步骤见 AWS-部署运维说明.md 第 5.7 节。
#
#  入口结构：
#    80  -> 301 到 https（跳转目标写死域名，不反射 Host 头）
#    443 -> http://127.0.0.1:7350（Nakama 容器由 docker-proxy 发布在 0.0.0.0:7350）
#
#  几个刻意的写法，改动前先看这里：
#
#  1. 兜底块用 server_name ""，不用惯用的 "_"。
#     发行版 /etc/nginx/nginx.conf 自带一个 listen 80 + server_name _ 的默认块
#     （提供 Welcome to nginx 页）。若这里也写 "_"，nginx -t 会报
#     `conflicting server name "_"` 警告。用 "" 既避开重名，又能做 default_server
#     把不认识的 Host 直接 444 掉，且**不需要改包管理的 nginx.conf**。
#
#  2. http2 是开的，所以**验 WebSocket 升级时必须让 curl 走 HTTP/1.1**（--http1.1）。
#     HTTP/2 禁止 Connection/Upgrade 这类连接级头，curl 协商成 h2 后会直接把
#     升级头丢掉，看起来像 nginx 没透传 —— 那是误报。真实 WebSocket 客户端
#     走 HTTP/1.1，不受影响。验证命令见运维说明 5.7。
#
#  3. 没有 add_header X-Content-Type-Options：Nakama 自己会发，再加会出现重复头。
# ============================================================================

# WebSocket 升级：Nakama 实时 Socket 走这条
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 80：兜底 server，丢掉 Host 不匹配的请求（挡掉发行版默认欢迎页） ----
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name "";
    return 444;
}

# ---- 80：本域名 -> 301 跳 443 ----
server {
    listen      80;
    listen      [::]:80;
    server_name hjzx.sfgames.io;

    # 留给以后用 Let's Encrypt HTTP-01 签证书
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 跳转目标写死域名，不用 $host —— 避免 Host 头被反射成任意跳转
    location / {
        return 301 https://hjzx.sfgames.io$request_uri;
    }
}

# ---- 443：TLS 终结，全部反代到 Nakama ----
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2 on;
    server_name hjzx.sfgames.io;

    ssl_certificate     /etc/nginx/ssl/hjzx.sfgames.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hjzx.sfgames.io/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 不加 add_header X-Content-Type-Options —— Nakama 自己已经发了，
    # 这里再加会出现重复头。

    location / {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;

        # 实时 Socket 必须的升级头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Socket 是长连接，且不能被缓冲
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        client_max_body_size 10m;
    }
}
